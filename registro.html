<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .rsvp-container {
  max-width: 500px;
  margin: 40px auto;
  padding: 30px;
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.1);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: #333;
}
.rsvp-container h2, .rsvp-container h3 {
  text-align: center;
  color: #b38f4f; /* Color elegante/boda */
}
.search-box {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}
.search-box input, #form-rsvp select {
  flex: 1;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px;
}
button {
  background: #b38f4f;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
  transition: background 0.3s;
}
button:hover {
  background: #96743b;
}
.item-resultado {
  padding: 12px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
  transition: background 0.2s;
}
.item-resultado:hover {
  background: #f9f6f0;
}
.radio-group {
  display: flex;
  gap: 20px;
  margin: 15px 0;
}
#form-rsvp label {
  display: block;
  margin-top: 15px;
  font-weight: 600;
}
    </style>
    <div class="rsvp-container">
  <h2>Confirmar Asistencia</h2>
  
  <!-- Paso 1: Buscador -->
  <div id="paso-busqueda">
    <p>Ingresa tu nombre o el de tu familia:</p>
    <div class="search-box">
      <input type="text" id="input-busqueda" placeholder="Ej: Familia Pérez o Juan...">
      <button id="btn-buscar">Buscar</button>
    </div>
    <div id="resultados-busqueda"></div>
  </div>

  <!-- Paso 2: Formulario de Confirmación (Oculto al inicio) -->
  <div id="paso-confirmacion" style="display: none;">
    <h3 id="txt-familia"></h3>
    <p id="txt-invitado-principal"></p>
    
    <form id="form-rsvp">
      <input type="hidden" id="input-fila">
      
      <label>¿Podrás asistir?</label>
      <div class="radio-group">
        <label><input type="radio" name="asistira" value="Si" checked> ¡Allí estaré!</label>
        <label><input type="radio" name="asistira" value="No"> Lamentablemente no</label>
      </div>

      <div id="seccion-pases">
        <label for="select-pases">Confirmar cantidad de asistentes:</label>
        <select id="select-pases">
          <!-- Se llena dinámicamente -->
        </select>
      </div>

      <button type="submit" id="btn-enviar">Confirmar mi lugar</button>
    </form>
  </div>
  
  <div id="mensaje-final" style="display:none;"></div>
</div>

<script src="check.js"></script>
</body>
</html>
